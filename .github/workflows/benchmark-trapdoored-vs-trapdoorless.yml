name: Benchmark Trapdoored Vs Trapdoorless

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - benches/bench_rsa.rs
      - figures/plot_On_results.py
      - Cargo.toml
      - Cargo.lock

jobs:
  bench-and-plot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas seaborn matplotlib

      - name: Run trapdoored vs trapdoorless benchmark group
        run: cargo bench --bench bench_rsa -- benchmark_trapdoored_vs_trapdoorless_accumulator

      - name: Generate O(n) plot
        run: python figures/plot_On_results.py

      - name: Upload benchmark and plotting artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trapdoored-vs-trapdoorless-results
          if-no-files-found: warn
          path: |
            target/criterion/trapdoored_vs_trapdoorless_accumulator/**
            figures/images/trapdoored_vs_trapdoorless.png
            data_for_latex/trapdoored_*.csv
            data_for_latex/trapdoorless_*.csv