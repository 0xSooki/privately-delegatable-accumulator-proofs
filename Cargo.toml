[package]
name = "private-accumulator-proof-delegation"
version = "0.1.3"
edition = "2021"
rust-version = "1.70"
description = "Cryptographic accumulators with private proof update delegation. Supports RSA, class-group, and bilinear-pairing constructions."
readme = "README.md"
repository = "https://github.com/GlaszBoti/private-accumulator-proof-delegation"
documentation = "https://docs.rs/private-accumulator-proof-delegation"
authors = ["Bence Soóki-Tóth <bence.sooki.toth@gmail.com>", "Botond Glasz <glasz.boti2002@gmail.com>", "Seres István András <seresistvanandras@gmail.com>"]
keywords = ["cryptography", "accumulator"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
exclude = [
    "benches/*",
    "figures/*",
    "misc/*",
    "Makefile.toml",
    ".github/*",
]

[features]
default = ["rsa", "bilinear"]
rsa = ["num-bigint", "num-traits", "num-integer", "glass_pumpkin"]
bilinear = ["ark-ec", "ark-ff", "ark-std", "ark-poly", "ark-poly-commit", "ark-bls12-381", "ark-serialize"]
class-group = ["class_group", "curv"]
serde = ["dep:serde"]

[dependencies]
rand = "0.8"
sha2 = "0.9"
hmac = "0.11"
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }

num-bigint = { version = "0.4", features = ["rand", "serde"], optional = true }
num-traits = { version = "0.2", optional = true }
num-integer = { version = "0.1", optional = true }
glass_pumpkin = { version = "1.0", optional = true }

ark-ec = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-std = { version = "0.4", optional = true }
ark-poly = { version = "0.4", optional = true }
ark-poly-commit = { version = "0.4", optional = true }
ark-bls12-381 = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }


class_group = { version = "0.6.1", optional = true }
curv = { package = "curv-kzen", version = "0.10", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "bench_rsa"
harness = false

[[bench]]
name = "bench_bilinear_vs_class_vs_rsa"
harness = false

[[bench]]
name = "bench_o1_bilinear_vs_class_vs_rsa"
harness = false

[[bench]]
name = "bench_bilinear_update_breakdown"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
